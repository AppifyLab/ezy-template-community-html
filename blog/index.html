<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/site.js" defer></script>
  </head>
  <body data-page="blog">
    <header class="site-header">
      <div class="wrap site-header-inner">
        <a href="/" class="brand">
          <span data-brand-mark="32"></span>
          <span class="brand-name" data-brand-name>Community</span>
        </a>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/about/">About</a>
          <a href="/blog/" class="active">Blog</a>
          <!-- /feeds is your community app, on this same address. -->
          <a href="/feeds">Community</a>
        </nav>
      </div>
    </header>

    <main class="wrap section">
      <p class="eyebrow" data-brand-name>Community</p>
      <h1>Blog</h1>
      <p class="lede" id="blog-empty" hidden>No posts published yet.</p>
      <div class="grid grid-3" id="blog-grid"></div>
      <nav class="pager" id="blog-pager" hidden></nav>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer-inner">
        <span>© <span data-year></span> <span data-brand-name>Community</span></span>
        <span class="muted">Powered by EzyCommunity</span>
      </div>
    </footer>
  </body>
</html>
