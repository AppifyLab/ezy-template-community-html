<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/site.js" defer></script>
  </head>
  <body data-page="404">
    <header class="site-header">
      <div class="wrap site-header-inner">
        <a href="/" class="brand">
          <span data-brand-mark="32"></span>
          <span class="brand-name" data-brand-name>Community</span>
        </a>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/about/">About</a>
          <a href="/blog/">Blog</a>
          <!-- /feeds is your community app, on this same address. -->
          <a href="/feeds">Community</a>
        </nav>
      </div>
    </header>

    <main class="wrap narrow section center">
      <span data-brand-mark="56"></span>
      <p class="eyebrow">404</p>
      <h1>This page does not exist</h1>
      <p class="lede">
        The page you were looking for isn’t part of <span data-brand-name>this site</span>.
      </p>
      <p><a class="button" href="/">Back to home</a></p>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer-inner">
        <span>© <span data-year></span> <span data-brand-name>Community</span></span>
        <span class="muted">Powered by EzyCommunity</span>
      </div>
    </footer>
  </body>
</html>
